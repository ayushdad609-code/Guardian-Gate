name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run safety check on a safe command
      run: python scripts/safety_check.py "ls -l"
    - name: Verify blocked command
      run: |
        if python scripts/safety_check.py "rm -rf /"; then
          echo "Error: Dangerous command was not blocked!"
          exit 1
        else
          echo "Success: Dangerous command was blocked."
        fi
